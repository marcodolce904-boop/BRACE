name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check English plugin
        run: python3 scripts/check_plugin.py plugins/brace en
      - name: Check Italian plugin
        run: python3 scripts/check_plugin.py plugins/brace-it it
      - name: Check EN/IT parity
        run: python3 scripts/check_parity.py
      - name: Shellcheck
        run: shellcheck plugins/*/scripts/*.sh tests/*.sh
      - name: Hook tests
        run: sh tests/test_hooks.sh
      - name: JSON syntax
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

  hooks-macos:
    # The startup hook must run with macOS /bin/sh (bash in POSIX mode) and BSD awk/head/date.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests (macOS)
        run: sh tests/test_hooks.sh
      - name: Unit tests (macOS)
        run: python3 -m unittest discover -s tests -v

  hooks-windows:
    # Claude Code runs shell-form hooks through Git Bash on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests (Windows, Git Bash)
        run: sh tests/test_hooks.sh
      - name: Windows paths and line endings
        run: bash tests/test_hooks_windows.sh
