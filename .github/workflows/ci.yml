name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check English plugin
        run: python3 scripts/check_plugin.py plugins/brace en
      - name: Check Italian plugin
        run: python3 scripts/check_plugin.py plugins/brace-it it
      - name: Check EN/IT parity
        run: python3 scripts/check_parity.py
      - name: Shellcheck
        run: shellcheck plugins/*/scripts/*.sh
      - name: JSON syntax
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
